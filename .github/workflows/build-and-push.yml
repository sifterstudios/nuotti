name: Build and Push (amd64 only)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# One self-hosted runner serves every workflow here, so rapid pushes to the same ref would
# otherwise stack up instead of superseding each other. Only the newest run per ref survives.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sifterstudios/nuotti
  BUILDX_CACHE: /mnt/user/appdata/gh-runner/buildx-cache

jobs:
  build-amd64:
    # Matches your Unraid runner labels from compose
    runs-on: [self-hosted, unraid, docker, amd64]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Nuotti.Backend/Dockerfile
            image: backend
          - service: audience
            context: .
            dockerfile: Nuotti.Audience/Dockerfile
            image: audience
          - service: performer
            context: .
            dockerfile: Nuotti.Performer/Dockerfile
            image: performer
          - service: web
            context: web
            dockerfile: web/Dockerfile
            image: web

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          cleanup: false
          driver-opts: |
            image=moby/buildkit:v0.13.2

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags/labels) with -amd64 suffix
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          flavor: |
            suffix=-amd64,onlatest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (native amd64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Must live on the array/cache pool, not under "/". Unraid's root filesystem is a
          # tmpfs held in RAM, so a multi-GB layer cache there is charged against memory.
          cache-from: type=local,src=${{ env.BUILDX_CACHE }}
          cache-to: type=local,dest=${{ env.BUILDX_CACHE }},mode=max

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ matrix.service }}-${{ github.run_number }}
          path: |
            **/*.log
            **/bin/**/*.log
            **/obj/**/*.log
          retention-days: 14
          if-no-files-found: ignore